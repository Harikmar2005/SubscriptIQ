version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subflow_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://subflow_user:subflow_password@db:5432/subflow_enterprise}
      - SECRET_KEY=${SECRET_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - IS_RAZORPAY_TEST_MODE=${IS_RAZORPAY_TEST_MODE:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subflow_celery_worker
    restart: unless-stopped
    command: celery -A app.core.celery_worker.celery_app worker -l info --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://subflow_user:subflow_password@db:5432/subflow_enterprise}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY}

  celery_scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subflow_renewal_cron
    restart: unless-stopped
    command: celery -A app.core.celery_worker.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://subflow_user:subflow_password@db:5432/subflow_enterprise}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}

  db:
    image: postgres:16-alpine
    container_name: subflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-subflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-subflow_enterprise}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
